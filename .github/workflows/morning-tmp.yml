name: morning-tmp
on:
  push:
    paths: ['research/morning.py', '.github/workflows/morning-tmp.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 -u research/morning.py
