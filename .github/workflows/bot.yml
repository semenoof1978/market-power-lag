name: Bot

on:
  schedule:
    # основной запуск — cron-job.org каждые 10 минут (workflow_dispatch, mode=auto);
    # расписание GitHub — запасное, раз в час
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'summary — прислать сводку сейчас, auto — обычная проверка'
        default: summary
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']

permissions:
  contents: write   # только для keepalive-коммита

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Install Pillow
        run: pip install --quiet --disable-pip-version-check pillow || true

      - name: Run bot
        run: mkdir -p state && python3 bot/mp_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode || 'summary' }}
          THRESHOLD: '1.5'
          SPREAD: '0.5'
          SUMMARY_HOUR: '23'
          DEBUG: '1'

      - name: Keep schedule alive
        # GitHub выключает расписание в публичном репозитории после 60 дней без коммитов
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - last) / 86400 )) -ge 45 ]; then
            git config user.name "mp-bot"
            git config user.email "mp-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: расписание бота активно"
            git push
          fi

      - name: Save bot memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: bot-state-${{ github.run_id }}
