name: Diag
on:
  push:
    branches: [main]
    paths: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: banki.ru page
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          curl -sS -m 40 -A "$UA" -H "Accept-Language: ru-RU,ru;q=0.9" -D headers.txt -o page.html "https://www.banki.ru/investment/mutual/card-kontradamarkpow/" || true
          echo "### headers"; head -20 headers.txt
          echo "### size"; wc -c page.html
          echo "### title"; grep -o "<title>[^<]*" page.html | head -2
          echo "### price-like numbers 15x,xx / 15x.xx"
          grep -oE ".{0,120}15[0-9][.,][0-9]{2}.{0,80}" page.html | head -20
          echo "### keywords"
          grep -oiE ".{0,100}(Цена покупки|Цена продажи|стоимость пая|buyPrice|sellPrice|price).{0,120}" page.html | head -20
          echo "### script srcs / api hints"
          grep -oE "(https?:)?//[a-z0-9.\-]*banki\.ru/[^\"' ]*(api|investment)[^\"' ]*" page.html | sort -u | head -20
