name: Diag
on:
  push:
    branches: [main]
    paths: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: MOEX lookup
        run: |
          q() { echo "### $1"; curl -sS -m 30 "$1" | head -c 3000; echo; }
          q "https://iss.moex.com/iss/securities.json?q=RU000A107G30&iss.meta=off"
          q "https://iss.moex.com/iss/securities.json?q=%D0%9C%D0%B0%D1%80%D0%BA%D0%B5%D1%82%20%D0%9F%D0%B0%D1%83%D1%8D%D1%80&iss.meta=off"
          q "https://iss.moex.com/iss/securities/RU000A107G30.json?iss.meta=off&iss.only=boards"
          echo "### TQIF list"
          curl -sS -m 30 "https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQIF/securities.json?iss.meta=off&iss.only=securities&securities.columns=SECID,ISIN,SHORTNAME,BOARDID" | grep -i -E "107G30|Пауэр|Power|Контрад" | head
          echo "### TQIF marketdata for fund"
          curl -sS -m 30 "https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQIF/securities/RU000A107G30.json?iss.meta=off&iss.only=marketdata,securities" | head -c 3000; echo
