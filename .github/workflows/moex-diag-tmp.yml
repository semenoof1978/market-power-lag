name: moex-diag-tmp
on:
  push:
    paths: ['.github/workflows/moex-diag-tmp.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p /tmp/d && cd /tmp/d
          echo "== chain presented by iss.moex.com"
          echo | openssl s_client -showcerts -servername iss.moex.com -connect iss.moex.com:443 2>/dev/null > chain.txt || true
          grep -E "^ *[0-9] s:|^   i:|Verify return|verify error" chain.txt | cut -c1-200
          awk '/BEGIN CERT/{n++} {print > "c" n ".pem"}' chain.txt || true
          for f in c*.pem; do echo "-- $f"; openssl x509 -in $f -noout -subject -issuer -dates -fingerprint -sha256 2>/dev/null | cut -c1-200; done
          echo "== official Russian root"
          curl -sS -m 20 -o root.crt -w "http=%{http_code}\n" https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt || true
          curl -sS -m 20 -o sub.crt -w "http=%{http_code}\n" https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt || true
          ls -la; head -c 200 root.crt; echo
          openssl x509 -in root.crt -noout -subject -issuer -dates -fingerprint -sha256 2>/dev/null | cut -c1-200
          echo "== curl with root"
          cat root.crt sub.crt > bundle.pem 2>/dev/null
          curl -sS -m 20 --cacert bundle.pem -o /dev/null -w "http=%{http_code}\n" "https://iss.moex.com/iss/index.json" || true
          echo "== ROOT PEM"; cat root.crt; echo "== SUB PEM"; cat sub.crt
