name: forecast-tmp
on:
  push:
    paths: ['research/forecast.py', '.github/workflows/forecast-tmp.yml']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q numpy
      - run: python3 -u research/forecast.py
